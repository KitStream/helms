apiVersion: v2
name: netbird
description: A Helm chart for deploying NetBird VPN management, signal, dashboard, and relay services on Kubernetes
type: application
version: 0.7.0
appVersion: "0.77.1"
keywords:
  - netbird
  - vpn
  - wireguard
  - mesh
  - networking
  - self-hosted
  - kubernetes
home: https://netbird.io
sources:
  - https://github.com/netbirdio/netbird
  - https://github.com/KitStream/helms
maintainers:
  - name: KitStream
    url: https://github.com/KitStream
icon: https://raw.githubusercontent.com/netbirdio/netbird/main/docs/media/logo-full.png
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: NetBird
      url: https://netbird.io
    - name: Source
      url: https://github.com/KitStream/helms
    - name: Initium
      url: https://github.com/KitStream/initium
  artifacthub.io/changes: |
    - kind: changed
      description: "BREAKING: server.ingressGrpc.annotations is now empty by default instead of carrying nginx-specific annotations, which were applied even when className pointed at another controller. ingress-nginx users must set them explicitly; the chart fails at template time if className is nginx and backend-protocol is missing. See the CHANGELOG for migration steps."
    - kind: changed
      description: Bump NetBird from 0.73.2 to 0.77.1
    - kind: changed
      description: Bump dashboard image from v2.39.0 to v2.91.0 to pair with server 0.77.x
