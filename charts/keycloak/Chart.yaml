apiVersion: v2
name: keycloak
description: A Helm chart for deploying Keycloak IAM using the upstream quay.io/keycloak/keycloak image on Kubernetes
type: application
version: 26.7.2
appVersion: "26.7.4"
keywords:
  - keycloak
  - iam
  - identity
  - authentication
  - oauth2
  - oidc
  - sso
  - self-hosted
  - kubernetes
home: https://www.keycloak.org
sources:
  - https://github.com/keycloak/keycloak
  - https://github.com/KitStream/helms
maintainers:
  - name: KitStream
    url: https://github.com/KitStream
icon: https://www.keycloak.org/resources/images/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Keycloak
      url: https://www.keycloak.org
    - name: Source
      url: https://github.com/KitStream/helms
  artifacthub.io/changes: |
    - kind: security
      description: Bump Keycloak from 26.6.3 to 26.7.2 — fixes CVE-2026-59888/59889 (jackson-databind) and CVE-2026-9796 (admin role rename TOCTOU allowing realm-wide privilege escalation)
    - kind: changed
      description: Use KC_BOOTSTRAP_ADMIN_USERNAME/KC_BOOTSTRAP_ADMIN_PASSWORD for the initial admin instead of the deprecated KEYCLOAK_ADMIN variables. No values change required.
