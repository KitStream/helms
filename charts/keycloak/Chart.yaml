apiVersion: v2
name: keycloak
description: A Helm chart for deploying Keycloak IAM using the upstream quay.io/keycloak/keycloak image on Kubernetes
type: application
version: 26.8.1
appVersion: "26.8.1"
keywords:
  - keycloak
  - iam
  - identity
  - authentication
  - oauth2
  - oidc
  - sso
  - self-hosted
  - kubernetes
home: https://www.keycloak.org
sources:
  - https://github.com/keycloak/keycloak
  - https://github.com/KitStream/helms
maintainers:
  - name: KitStream
    url: https://github.com/KitStream
icon: https://www.keycloak.org/resources/images/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Keycloak
      url: https://www.keycloak.org
    - name: Source
      url: https://github.com/KitStream/helms
  artifacthub.io/changes: |
    - kind: security
      description: Bump Keycloak from 26.7.4 to 26.8.1 — ~20 upstream CVE fixes including CVE-2026-94000 (manage-users to realm-admin escalation), CVE-2026-94218 (2FA bypass), CVE-2026-96446 (PAR single-use bypass), and CVE-2026-97846 (token-exchange mTLS binding bypass)
    - kind: changed
      description: Keycloak 26.8 persists login failures in the database; the first start against an existing database runs a schema migration and background index creation
